<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="02-extraction-title 02-extraction-desc"><title id="02-extraction-title">Extract：把原文变成可检查的事实</title><desc id="02-extraction-desc">先明确要什么，再识别实体与关系；可信度来自证据、校验和业务验收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#92a3af"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="1280" height="720" rx="6" fill="#ffffff" stroke="#ffffff"/><text x="48" y="42" font-size="16" fill="#2463ad" font-weight="600">SEMANTICA / KNOWLEDGE ENGINEERING</text><text x="48" y="98" font-size="40" fill="#202b34" font-weight="600">Extract：把原文变成可检查的事实</text><text x="48" y="136" font-size="20" fill="#566773" font-weight="400">先明确要什么，再识别实体与关系；可信度来自证据、校验和业务验收。</text><text x="1184" y="42" font-size="20" fill="#566773" font-weight="400">02</text><path d="M48,160 L1232,160" fill="none" stroke="#92a3af" stroke-width="1.5"/><path d="M312,258 L332,258" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M620,258 L640,258" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M928,258 L948,258" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="192" width="264" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="68" y="226" font-size="24" fill="#202b34" font-weight="600">1  定义抽取目标</text><text x="68" y="260" font-size="20" fill="#566773" font-weight="400">类型偏好 · 提示词</text><text x="68" y="288" font-size="20" fill="#566773" font-weight="400">规则 / 模型 / LLM</text><rect x="340" y="192" width="280" height="124" rx="6" fill="#edf5fc" stroke="#2463ad"/><text x="360" y="226" font-size="24" fill="#2463ad" font-weight="600">2  识别实体与关系</text><text x="360" y="260" font-size="20" fill="#566773" font-weight="400">识别人名、组织等实体</text><text x="360" y="288" font-size="20" fill="#566773" font-weight="400">识别实体间的语义联系</text><rect x="648" y="192" width="280" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="668" y="226" font-size="24" fill="#202b34" font-weight="600">3  结构化与基础检查</text><text x="668" y="260" font-size="20" fill="#566773" font-weight="400">实体 · 关系 · 三元组</text><text x="668" y="288" font-size="20" fill="#566773" font-weight="400">空值 / 端点 / 分数检查</text><rect x="956" y="192" width="276" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="976" y="226" font-size="24" fill="#202b34" font-weight="600">4  交给后续处理</text><text x="976" y="260" font-size="20" fill="#566773" font-weight="400">冲突检测与去重</text><text x="976" y="288" font-size="20" fill="#566773" font-weight="400">形成候选知识图谱</text><text x="48" y="360" font-size="20" fill="#167c75" font-weight="600">一个例子</text><text x="208" y="360" font-size="24" fill="#202b34" font-weight="600">原文：张明是华星公司的工程师。</text><path d="M48,382 L1232,382" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="418" font-size="20" fill="#2463ad" font-weight="600">实体</text><text x="152" y="418" font-size="20" fill="#202b34" font-weight="400">张明：人物；华星公司：组织</text><text x="676" y="418" font-size="20" fill="#2463ad" font-weight="600">关系</text><text x="780" y="418" font-size="20" fill="#202b34" font-weight="400">张明 — 任职于 → 华星公司</text><text x="152" y="452" font-size="20" fill="#566773" font-weight="400">“工程师”可建为职业属性或类型，由业务定义决定。</text><path d="M48,478 L1232,478" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="514" font-size="24" fill="#2463ad" font-weight="600">项目已有</text><text x="256" y="512" font-size="20" fill="#202b34" font-weight="400">多种抽取方式；结构化结果；基础校验；可接入来源记录。</text><text x="48" y="554" font-size="24" fill="#167c75" font-weight="600">使用者配置</text><text x="256" y="552" font-size="20" fill="#202b34" font-weight="400">指定领域与类型；连接证据定位；制定复核和入库条件。</text><text x="48" y="594" font-size="24" fill="#202b34" font-weight="600">上线前验收</text><text x="256" y="592" font-size="20" fill="#202b34" font-weight="400">用业务标注样本评测准确率与召回率，复核关键事实及错误案例。</text><text x="256" y="626" font-size="16" fill="#566773" font-weight="400">类型偏好不是严格白名单；来源链路需显式接入。</text><path d="M48,658 L1232,658" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="692" font-size="16" fill="#566773" font-weight="400">可信边界：模型分数不等于实测准确率；格式正确不等于事实正确，系统不承诺零错误。</text></svg>