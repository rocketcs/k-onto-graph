<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="03-participation-title 03-participation-desc"><title id="03-participation-title">知识增强：用户做什么，得到什么</title><desc id="03-participation-desc">四项能力协同工作；用户定义业务口径，并决定哪些结果可以采纳。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77716b"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="1280" height="720" fill="#ffffff" stroke="#ffffff"/><text x="48" y="42" font-size="16" fill="#191919" font-weight="600">SEMANTICA / KNOWLEDGE ENGINEERING</text><text x="48" y="98" font-size="40" fill="#191919" font-weight="600">知识增强：用户做什么，得到什么</text><text x="48" y="136" font-size="20" fill="#595959" font-weight="400">四项能力协同工作；用户定义业务口径，并决定哪些结果可以采纳。</text><text x="1184" y="42" font-size="20" fill="#595959" font-weight="400">03</text><path d="M48,160 L1232,160" fill="none" stroke="#77716b" stroke-width="1.5"/><path d="M48 160 H224" stroke="#b83c2d" stroke-width="5"/><text x="208" y="210" font-size="24" fill="#191919" font-weight="600">本体 Ontology</text><text x="468" y="210" font-size="24" fill="#191919" font-weight="600">推理 Reasoning</text><text x="728" y="210" font-size="24" fill="#191919" font-weight="600">溯源 Provenance</text><text x="988" y="210" font-size="24" fill="#191919" font-weight="600">决策 Decisions</text><rect x="48" y="228" width="1184" height="96" fill="#f5f4f2"/><text x="68" y="266" font-size="24" fill="#191919" font-weight="600">用户提供</text><text x="208" y="260" font-size="20" fill="#191919" font-weight="400">概念、关系与业务约束</text><text x="208" y="292" font-size="20" fill="#191919" font-weight="400">选择模板或确认候选定义</text><text x="468" y="260" font-size="20" fill="#191919" font-weight="400">业务事实与推导规则</text><text x="468" y="292" font-size="20" fill="#191919" font-weight="400">确认规则的适用范围</text><text x="728" y="260" font-size="20" fill="#191919" font-weight="400">来源标识与版本信息</text><text x="728" y="292" font-size="20" fill="#191919" font-weight="400">接入原文位置等元数据</text><text x="988" y="260" font-size="20" fill="#191919" font-weight="400">取舍策略与采纳标准</text><text x="988" y="292" font-size="20" fill="#191919" font-weight="400">处理例外和人工复核</text><rect x="48" y="340" width="1184" height="96" fill="#f5f4f2"/><text x="68" y="378" font-size="24" fill="#191919" font-weight="600">系统处理</text><text x="208" y="372" font-size="20" fill="#191919" font-weight="400">构建类、属性与层级</text><text x="208" y="404" font-size="20" fill="#191919" font-weight="400">显式调用约束校验</text><text x="468" y="372" font-size="20" fill="#191919" font-weight="400">匹配前提并绑定变量</text><text x="468" y="404" font-size="20" fill="#191919" font-weight="400">按规则推导结论</text><text x="728" y="372" font-size="20" fill="#191919" font-weight="400">关联知识与处理活动</text><text x="728" y="404" font-size="20" fill="#191919" font-weight="400">保存来源及派生链路</text><text x="988" y="372" font-size="20" fill="#191919" font-weight="400">按策略处理冲突</text><text x="988" y="404" font-size="20" fill="#191919" font-weight="400">记录选择与裁决理由</text><rect x="48" y="452" width="1184" height="96" fill="#eeece9"/><text x="68" y="490" font-size="24" fill="#b83c2d" font-weight="600">交付产物</text><text x="208" y="484" font-size="20" fill="#191919" font-weight="400">本体定义 OWL</text><text x="208" y="516" font-size="20" fill="#191919" font-weight="400">SHACL 约束 / 违规报告</text><text x="468" y="484" font-size="20" fill="#191919" font-weight="400">推导结果及相关依据</text><text x="468" y="516" font-size="20" fill="#191919" font-weight="400">与原始事实区分使用</text><text x="728" y="484" font-size="20" fill="#191919" font-weight="400">来源记录与知识血缘</text><text x="728" y="516" font-size="20" fill="#191919" font-weight="400">可查询或导出 PROV</text><text x="988" y="484" font-size="20" fill="#191919" font-weight="400">裁决结果与决策记录</text><text x="988" y="516" font-size="20" fill="#191919" font-weight="400">采纳与否由业务决定</text><text x="48" y="600" font-size="24" fill="#b83c2d" font-weight="600">贯穿全程</text><text x="208" y="598" font-size="24" fill="#191919" font-weight="400">溯源应随抽取、校验、推导和裁决持续记录，而非结束后补做。</text><text x="208" y="632" font-size="20" fill="#595959" font-weight="400">本体定义“如何表达”；规则决定“如何推导”；业务审核决定“是否采纳”。</text><path d="M48,658 L1232,658" fill="none" stroke="#77716b" stroke-width="1.5"/><text x="48" y="692" font-size="16" fill="#595959" font-weight="400">能力边界：来源可追查不代表内容已被证实；审批记录能力不等于已提供自动审批界面。</text></svg>