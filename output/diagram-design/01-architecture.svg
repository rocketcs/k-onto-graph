<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="01-architecture-title 01-architecture-desc"><title id="01-architecture-title">从文档到可用的知识图谱</title><desc id="01-architecture-desc">数据处理建立事实基础，知识增强补充结构、推导依据与决策记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#92a3af"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="1280" height="720" rx="6" fill="#ffffff" stroke="#ffffff"/><text x="48" y="42" font-size="16" fill="#2463ad" font-weight="600">SEMANTICA / KNOWLEDGE ENGINEERING</text><text x="48" y="98" font-size="40" fill="#202b34" font-weight="600">从文档到可用的知识图谱</text><text x="48" y="136" font-size="20" fill="#566773" font-weight="400">数据处理建立事实基础，知识增强补充结构、推导依据与决策记录。</text><text x="1184" y="42" font-size="20" fill="#566773" font-weight="400">01</text><path d="M48,160 L1232,160" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="198" font-size="20" fill="#2463ad" font-weight="600">01  数据进入与知识构建</text><path d="M272,282 L304,282" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M588,282 L620,282" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M884,282 L916,282" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="220" width="224" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="68" y="254" font-size="24" fill="#202b34" font-weight="600">数据来源</text><text x="68" y="288" font-size="20" fill="#566773" font-weight="400">文件 · 网页 · 数据库</text><text x="68" y="316" font-size="20" fill="#566773" font-weight="400">Sources</text><rect x="304" y="220" width="284" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="324" y="254" font-size="24" fill="#202b34" font-weight="600">接入与预处理</text><text x="324" y="288" font-size="20" fill="#566773" font-weight="400">Ingest → Parse</text><text x="324" y="316" font-size="20" fill="#566773" font-weight="400">Normalize → Split</text><rect x="620" y="220" width="264" height="124" rx="6" fill="#edf5fc" stroke="#2463ad"/><text x="640" y="254" font-size="24" fill="#2463ad" font-weight="600">语义提取</text><text x="640" y="288" font-size="20" fill="#566773" font-weight="400">Extract</text><text x="640" y="316" font-size="20" fill="#566773" font-weight="400">实体 · 关系 · 三元组</text><rect x="916" y="220" width="316" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="936" y="254" font-size="24" fill="#202b34" font-weight="600">知识整理</text><text x="936" y="288" font-size="20" fill="#566773" font-weight="400">Conflict Detection</text><text x="936" y="316" font-size="20" fill="#566773" font-weight="400">Deduplication → KG</text><path d="M1074,344 L1074,400" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="386" font-size="20" fill="#2463ad" font-weight="600">02  知识增强与存储</text><path d="M820,460 L772,460" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M476,460 L432,460" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="820" y="400" width="412" height="124" rx="6" fill="#edf5fc" stroke="#2463ad"/><text x="840" y="434" font-size="24" fill="#2463ad" font-weight="600">知识增强 → Enriched KG</text><text x="840" y="468" font-size="20" fill="#566773" font-weight="400">本体 Ontology · 推理 Reasoning</text><text x="840" y="496" font-size="20" fill="#566773" font-weight="400">溯源 Provenance · 决策 Decisions</text><rect x="476" y="400" width="296" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="496" y="434" font-size="24" fill="#202b34" font-weight="600">多模型存储</text><text x="496" y="468" font-size="20" fill="#566773" font-weight="400">Vector Store</text><text x="496" y="496" font-size="20" fill="#566773" font-weight="400">Graph Store：RDF / LPG</text><rect x="48" y="400" width="384" height="124" rx="6" fill="#f8fafb" stroke="#cbd5dc"/><text x="68" y="434" font-size="24" fill="#202b34" font-weight="600">交付与使用</text><text x="68" y="468" font-size="20" fill="#566773" font-weight="400">Export · Visualize</text><text x="68" y="496" font-size="20" fill="#566773" font-weight="400">REST · MCP · CLI</text><path d="M48,554 L1232,554" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="590" font-size="24" fill="#167c75" font-weight="600">贯穿式支撑</text><text x="264" y="588" font-size="24" fill="#202b34" font-weight="400">来源记录与血缘追踪  /  质量检查  /  业务规则与配置</text><text x="264" y="622" font-size="20" fill="#566773" font-weight="400">按业务编排连接各模块；增强能力并非默认全部自动执行。</text><path d="M48,658 L1232,658" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="692" font-size="16" fill="#566773" font-weight="400">阅读方向：第一行从左到右，第二行从右到左。概览聚合次级组件，保留核心数据流程。</text></svg>