<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="04-implementation-title 04-implementation-desc"><title id="04-implementation-title">知识增强的实现机制</title><desc id="04-implementation-desc">模块内部各有处理链路，通过业务编排接入知识图谱。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#92a3af"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="1280" height="720" rx="6" fill="#ffffff" stroke="#ffffff"/><text x="48" y="42" font-size="16" fill="#2463ad" font-weight="600">SEMANTICA / KNOWLEDGE ENGINEERING</text><text x="48" y="98" font-size="40" fill="#202b34" font-weight="600">知识增强的实现机制</text><text x="48" y="136" font-size="20" fill="#566773" font-weight="400">模块内部各有处理链路，通过业务编排接入知识图谱。</text><text x="1184" y="42" font-size="20" fill="#566773" font-weight="400">04</text><path d="M48,160 L1232,160" fill="none" stroke="#92a3af" stroke-width="1.5"/><path d="M704,232 L752,232" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="212" font-size="28" fill="#2463ad" font-weight="600">本体</text><text x="48" y="244" font-size="16" fill="#566773" font-weight="400">OntologyEngine</text><rect x="284" y="184" width="420" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><rect x="752" y="184" width="480" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><text x="300" y="208" font-size="20" fill="#202b34" font-weight="600">输入与构建</text><text x="768" y="208" font-size="20" fill="#202b34" font-weight="600">标准化与校验</text><text x="300" y="240" font-size="20" fill="#566773" font-weight="400">实体关系 / 文本 / 模板 / 外部本体</text><text x="300" y="272" font-size="20" fill="#566773" font-weight="400">按类型归类，生成属性与层级</text><text x="768" y="240" font-size="20" fill="#566773" font-weight="400">OWL 表达；生成 SHACL 约束</text><text x="768" y="272" font-size="20" fill="#566773" font-weight="400">显式调用 pyshacl，返回违规报告</text><path d="M704,344 L752,344" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="324" font-size="28" fill="#2463ad" font-weight="600">推理</text><text x="48" y="356" font-size="16" fill="#566773" font-weight="400">Reasoner</text><rect x="284" y="296" width="420" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><rect x="752" y="296" width="480" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><text x="300" y="320" font-size="20" fill="#202b34" font-weight="600">载入与匹配</text><text x="768" y="320" font-size="20" fill="#202b34" font-weight="600">推导与返回</text><text x="300" y="352" font-size="20" fill="#566773" font-weight="400">add_fact / add_rule</text><text x="300" y="384" font-size="20" fill="#566773" font-weight="400">匹配规则前提并绑定变量</text><text x="768" y="352" font-size="20" fill="#566773" font-weight="400">前向链推导；后向链查找依据</text><text x="768" y="384" font-size="20" fill="#566773" font-weight="400">规则示例：工程师(x) → 员工(x)</text><path d="M704,456 L752,456" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="436" font-size="28" fill="#167c75" font-weight="600">溯源</text><text x="48" y="468" font-size="16" fill="#566773" font-weight="400">ProvenanceManager</text><rect x="284" y="408" width="420" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><rect x="752" y="408" width="480" height="104" rx="6" fill="#f0f7f7" stroke="#cbd5dc"/><text x="300" y="432" font-size="20" fill="#202b34" font-weight="600">记录与关联</text><text x="768" y="432" font-size="20" fill="#202b34" font-weight="600">保存与查询</text><text x="300" y="464" font-size="20" fill="#566773" font-weight="400">知识 ID、来源、执行者与时间</text><text x="300" y="496" font-size="20" fill="#566773" font-weight="400">接入处理活动及派生关系</text><text x="768" y="464" font-size="20" fill="#566773" font-weight="400">内存或 SQLite 保存记录</text><text x="768" y="496" font-size="20" fill="#566773" font-weight="400">追踪血缘，导出 PROV 来源记录</text><path d="M704,568 L752,568" fill="none" stroke="#92a3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="548" font-size="28" fill="#2463ad" font-weight="600">决策</text><text x="48" y="580" font-size="16" fill="#566773" font-weight="400">Resolver + Recorder</text><rect x="284" y="520" width="420" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><rect x="752" y="520" width="480" height="104" rx="6" fill="#f7f9fa" stroke="#cbd5dc"/><text x="300" y="544" font-size="20" fill="#202b34" font-weight="600">输入与策略选择</text><text x="768" y="544" font-size="20" fill="#202b34" font-weight="600">记录与业务采纳</text><text x="300" y="576" font-size="20" fill="#566773" font-weight="400">冲突候选值、来源与业务上下文</text><text x="300" y="608" font-size="20" fill="#566773" font-weight="400">投票 / 可信度 / 时效 / 置信度</text><text x="768" y="576" font-size="20" fill="#566773" font-weight="400">保存裁决结果、理由及关联实体</text><text x="768" y="608" font-size="20" fill="#566773" font-weight="400">连接业务复核，由业务决定采纳</text><text x="48" y="646" font-size="20" fill="#167c75" font-weight="600">组合产物：本体定义 + 推导结果 + 来源链路 + 决策记录 → 增强知识图谱</text><path d="M48,658 L1232,658" fill="none" stroke="#92a3af" stroke-width="1.5"/><text x="48" y="692" font-size="16" fill="#566773" font-weight="400">实现边界：本体验证器尚未接入完整 OWL 一致性推理；冲突处理与决策记录需编排连接。</text></svg>